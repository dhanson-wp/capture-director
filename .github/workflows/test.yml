name: Tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      # The tests run ffmpeg: they parse the generated filter expressions and
      # process a recorded video. capture-director passes filter graphs as files
      # (-/filter_complex), which needs ffmpeg 7 or later, and Ubuntu's package
      # is 6.1, so install a static 9.0 build instead.
      # The tests never launch Chrome, so there's no browser to install.
      - name: Install ffmpeg
        run: |
          curl -fsSL -o /tmp/ffmpeg.tar.xz https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-n9.0-latest-linux64-gpl-9.0.tar.xz
          mkdir -p /tmp/ffmpeg && tar -xJf /tmp/ffmpeg.tar.xz -C /tmp/ffmpeg --strip-components=1
          echo /tmp/ffmpeg/bin >> "$GITHUB_PATH"
      - run: ffmpeg -version | head -1
      - run: npm ci
      - run: npm test
